name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: wholesaler_user
          POSTGRES_PASSWORD: wholesaler_pass
          POSTGRES_DB: wholesaler
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock

      - name: Create .env file
        run: |
          cat > .env << EOF
          ENVIRONMENT=testing
          DEBUG=false
          LOG_LEVEL=INFO
          DATABASE_URL=postgresql+psycopg2://wholesaler_user:wholesaler_pass@localhost:5432/wholesaler
          REDIS_URL=redis://localhost:6379/0
          SOCRATA_API_KEY=${{ secrets.SOCRATA_API_KEY || 'test_key' }}
          SOCRATA_API_SECRET=${{ secrets.SOCRATA_API_SECRET || 'test_secret' }}
          SOCRATA_APP_TOKEN=${{ secrets.SOCRATA_APP_TOKEN || 'test_token' }}
          EOF

      - name: Run database migrations
        run: |
          alembic upgrade head

      - name: Create test database
        env:
          PGPASSWORD: wholesaler_pass
        run: |
          psql -h localhost -U wholesaler_user -d wholesaler \
            -c "CREATE DATABASE wholesaler_test OWNER wholesaler_user;"
          psql -h localhost -U wholesaler_user -d wholesaler_test \
            -c "CREATE EXTENSION IF NOT EXISTS postgis;"

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://wholesaler_user:wholesaler_pass@localhost:5432/wholesaler_test
        run: |
          # Integration tests call live county APIs, so they are excluded from
          # the blocking run and covered separately by the integration job.
          pytest tests/ -v -m "not integration" \
            --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  api-health-check:
    name: API Health Check
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: wholesaler_user
          POSTGRES_PASSWORD: wholesaler_pass
          POSTGRES_DB: wholesaler
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env file
        run: |
          cat > .env << EOF
          ENVIRONMENT=testing
          DEBUG=false
          LOG_LEVEL=INFO
          DATABASE_URL=postgresql+psycopg2://wholesaler_user:wholesaler_pass@localhost:5432/wholesaler
          REDIS_URL=redis://localhost:6379/0
          SOCRATA_API_KEY=test_key
          SOCRATA_API_SECRET=test_secret
          SOCRATA_APP_TOKEN=test_token
          EOF

      - name: Run database migrations
        run: |
          alembic upgrade head

      - name: Start API server in background
        run: |
          python -m uvicorn src.wholesaler.api.main:app --host 0.0.0.0 --port 8000 &
          echo $! > api.pid
          sleep 10

      - name: Test API endpoints
        run: |
          # Health check
          curl -f http://localhost:8000/health || exit 1

          # Root endpoint
          curl -f http://localhost:8000/ || exit 1

          # OpenAPI docs
          curl -f http://localhost:8000/docs || exit 1

      - name: Stop API server
        if: always()
        run: |
          if [ -f api.pid ]; then
            kill $(cat api.pid) || true
          fi

  streamlit-validation:
    name: Validate Streamlit Dashboard
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install streamlit

      - name: Validate Streamlit app syntax
        run: |
          python -m py_compile src/wholesaler/frontend/app.py

          # Check all page files
          for page in src/wholesaler/frontend/pages/*.py; do
            if [ -f "$page" ]; then
              python -m py_compile "$page"
            fi
          done

      - name: Check Streamlit configuration
        run: |
          if [ -f .streamlit/config.toml ]; then
            echo "Streamlit config found"
            cat .streamlit/config.toml
          else
            echo "No Streamlit config - using defaults"
          fi

  integration-tests:
    name: Integration Tests (live APIs)
    runs-on: ubuntu-latest
    needs: test
    # These call live county APIs, so a failure means the upstream source
    # changed or is down, not that this change is broken. Reported, not blocking.
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run integration tests
        run: |
          pytest tests/ -v -m "integration"

  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort

      - name: Run flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics

          # Exit-zero treats all errors as warnings
          flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      # Advisory: the codebase predates these formatters, so they are reported
      # but do not block. continue-on-error surfaces a real failure state
      # instead of a green step that swallowed the result.
      - name: Check formatting with black
        continue-on-error: true
        run: |
          black --check --diff src/ tests/

      - name: Check import sorting
        continue-on-error: true
        run: |
          isort --check-only --diff src/ tests/

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [test, api-health-check, streamlit-validation, lint]
    if: always()

    steps:
      - name: Check build status
        run: |
          # Report each result as it actually came back. Printing a checkmark
          # next to a failed job is how a red pipeline looks green.
          status() {
            if [ "$2" = "success" ]; then echo "PASS  $1"; else echo "FAIL  $1 ($2)"; fi
          }
          status "Tests"                "${{ needs.test.result }}"
          status "API Health"           "${{ needs.api-health-check.result }}"
          status "Streamlit Validation" "${{ needs.streamlit-validation.result }}"
          echo "note  Code Quality: ${{ needs.lint.result }} (advisory, not blocking)"

          if [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.api-health-check.result }}" != "success" ] || \
             [ "${{ needs.streamlit-validation.result }}" != "success" ]; then
            echo "Build failed"
            exit 1
          fi

          echo "All required checks passed"
